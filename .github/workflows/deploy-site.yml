name: Validate Factory site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Lint site
        working-directory: site
        run: npm run lint
      - name: Enforce temporary development audit exception expiry
        env:
          DEV_AUDIT_EXCEPTION_EXPIRES: "2026-11-12"
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$DEV_AUDIT_EXCEPTION_EXPIRES" || "$today" == "$DEV_AUDIT_EXCEPTION_EXPIRES" ]]; then
            echo "The temporary development dependency audit exception expired on $DEV_AUDIT_EXCEPTION_EXPIRES; review and remove or renew it."
            exit 1
          fi
      - name: Audit production site dependencies
        working-directory: site
        run: npm run audit
      - name: Build and verify site
        working-directory: site
        run: npm test
      - name: Install Chromium for the production Worker browser check
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Verify built Worker hydration at desktop and mobile widths
        working-directory: site
        run: HYDRATION_SERVER_MODE=production npm run test:hydration
