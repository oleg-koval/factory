name: Validate Factory site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Lint site
        working-directory: site
        run: npm run lint
      - name: Audit site dependency tree
        working-directory: site
        run: npm audit --audit-level=moderate
      - name: Build and verify site
        working-directory: site
        run: npm test
      - name: Verify built Worker hydration at desktop and mobile widths
        working-directory: site
        run: HYDRATION_SERVER_MODE=production npm run test:hydration
