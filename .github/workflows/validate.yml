name: Validate Factory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
      - name: Run structural and behavioral gates
        run: zsh tests/check.sh
