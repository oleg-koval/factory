name: Deploy Factory Worker

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-factory-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Lint site
        working-directory: site
        run: npm run lint

      - name: Build and test site
        working-directory: site
        run: npm test

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository Actions secret."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      - name: Verify production HTML
        run: |
          html_file="$RUNNER_TEMP/factory-home.html"
          curl --fail --silent --show-error https://factory.olegkoval.com/ --output "$html_file"
          grep -Fq 'googletagmanager.com/gtag/js?id=G-0RRTME2WMJ' "$html_file"
          grep -Fq "gtag('config', 'G-0RRTME2WMJ')" "$html_file"
          grep -Fq 'sellwithboost.com/badge/listing.svg' "$html_file"
